\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3ee6f0\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:block\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3 7l9 6 9-6\"><\u002Fpath><\u002Fsvg>\n      <span>Contact us:<\u002Fspan>\n      <a href=\"mailto:info@digitalgeosciences.com\" style=\"color:#e3f1f5;font-weight:500\" style-hover=\"color:#3ee6f0\">info@digitalgeosciences.com<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Aurora&quot;,&quot;Canyon&quot;,&quot;Terrain&quot;],&quot;default&quot;:&quot;Aurora&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;animationSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:1.8,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;}}\">\nclass Component extends DCLogic {\n  canvasRef = React.createRef();\n  componentDidMount() { this.startBg(); }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener('resize', this._resize);\n    window.removeEventListener('mousemove', this._mm);\n  }\n  startBg() {\n    const c = this.canvasRef.current; if (!c) return;\n    const ctx = c.getContext('2d');\n    let W = 0, H = 0;\n    const resize = () => { const d = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; c.width = W * d; c.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };\n    resize(); this._resize = resize; window.addEventListener('resize', resize);\n    let mx = 0, my = 0, tmx = 0, tmy = 0;\n    this._mm = (e) => {\n      tmx = e.clientX / W - 0.5; tmy = e.clientY / H - 0.5;\n    };\n    window.addEventListener('mousemove', this._mm);\n    const PAL = {\n      Aurora: { low: [40, 70, 210], mid: [62, 230, 240], high: [232, 121, 249] },\n      Canyon: { low: [40, 70, 90], mid: [120, 190, 200], high: [230, 245, 250] },\n      Terrain: { low: [30, 90, 200], mid: [60, 220, 140], high: [250, 80, 110] },\n    };\n    const bits = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), v: 0.00004 + Math.random() * 0.00012, p: Math.random() * 6 }));\n    const seed = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };\n    const hgt = (x, z, t) =>\n      0.45 * Math.sin(x * 0.5 + t * 0.3) * Math.cos(z * 0.6 - t * 0.25) +\n      0.25 * Math.sin(x * 1.1 - z * 0.8 + t * 0.5) +\n      0.1 * Math.sin(x * 2.3 + z * 1.7) +\n      1.1 * Math.exp(-((x - 2.4) ** 2 + (z - 5.5) ** 2) / 1.6) -\n      0.5 * Math.exp(-((x - 2.4) ** 2 + (z - 5.5) ** 2) / 0.25);\n    const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];\n    let t = 0, last = performance.now();\n    const frame = (now) => {\n      const dt = Math.min(50, now - last); last = now;\n      const speed = this.props.animationSpeed ?? 1;\n      t += dt * 0.001 * speed;\n      mx += (tmx - mx) * 0.04; my += (tmy - my) * 0.04;\n      const pal = PAL[this.props.palette] || PAL.Aurora;\n      const dens = this.props.density ?? 1;\n      const cols = Math.max(20, Math.round(60 * dens)), rows = Math.max(12, Math.round(32 * dens));\n      ctx.clearRect(0, 0, W, H);\n      const f = Math.max(W, H * 1.4) * 0.55, horizon = H * 0.38 + my * 24, camH = 1.3, cx = W / 2;\n      const zN = 1.2, zF = 11, scanZ = zN + ((t * 0.12) % 1) * (zF - zN);\n      const grid = [];\n      for (let r = 0; r < rows; r++) {\n        const z = zF - Math.pow(r / (rows - 1), 1.2) * (zF - zN);\n        const row = [];\n        for (let k = 0; k < cols; k++) {\n          const x = (k / (cols - 1) - 0.5) * 16 + mx * 1.5;\n          const y = hgt(x, z + t * 0.4, t);\n          const sx = cx + (x - mx * 1.5 * 0.2) / z * f, sy = horizon + (camH - y) / z * f * 0.55;\n          const hn = Math.max(0, Math.min(1, (y + 0.6) / 1.9));\n          const col = hn < 0.5 ? mix(pal.low, pal.mid, hn * 2) : mix(pal.mid, pal.high, (hn - 0.5) * 2);\n          const fade = Math.pow(1 - (z - zN) / (zF - zN), 0.8);\n          const boost = Math.exp(-((z - scanZ) ** 2) * 1.5);\n          row.push({ sx, sy, col, fade, boost });\n        }\n        grid.push(row);\n      }\n      ctx.lineWidth = 0.6;\n      for (let r = 0; r < rows; r++) {\n        const row = grid[r];\n        ctx.beginPath();\n        for (let k = 0; k < cols; k++) { const p = row[k]; k ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy); }\n        const p0 = row[0];\n        ctx.strokeStyle = `rgba(${pal.mid.join(',')},${0.05 + p0.fade * 0.12 + p0.boost * 0.35})`;\n        ctx.stroke();\n      }\n      ctx.beginPath();\n      for (let r = 0; r < rows - 1; r++) for (let k = 0; k < cols - 1; k++) {\n        const s = seed(r, k);\n        if (s < 0.14) { const a = grid[r][k], b = grid[r + 1][k + 1]; ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); }\n        else if (s > 0.9) { const a = grid[r][k + 1], b = grid[r + 1][k]; ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); }\n        else if (k % 3 === 0) { const a = grid[r][k], b = grid[r + 1][k]; ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); }\n      }\n      ctx.strokeStyle = `rgba(${pal.mid.join(',')},0.07)`;\n      ctx.stroke();\n      for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {\n        const p = grid[r][k];\n        const a = 0.15 + p.fade * 0.6 + p.boost * 0.4;\n        const s = 0.8 + p.fade * 1.6 + p.boost * 1.4;\n        ctx.fillStyle = `rgba(${p.col[0] | 0},${p.col[1] | 0},${p.col[2] | 0},${Math.min(1, a)})`;\n        ctx.fillRect(p.sx - s / 2, p.sy - s / 2, s, s);\n      }\n      for (const b of bits) {\n        b.y -= b.v * dt * speed; if (b.y < 0) { b.y = 1; b.x = Math.random(); }\n        const a = 0.25 + 0.5 * Math.abs(Math.sin(t * 2 + b.p));\n        ctx.fillStyle = `rgba(${pal.high.join(',')},${a * (b.y < 0.6 ? b.y / 0.6 : 1) * 0.6})`;\n        ctx.fillRect(b.x * W, b.y * H * 0.7, 2, 2);\n      }\n      this.raf = requestAnimationFrame(frame);\n    };\n    this.raf = requestAnimationFrame(frame);\n  }\n\n  renderVals() { return { canvasRef: this.canvasRef }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>
